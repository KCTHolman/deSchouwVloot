# .fleet.yml — het consumer-contract van deFleet ZELF.
#
# deFleet is z'n eigen eerste extra consument (docs/architectuur.md §3b): fleet-infrawerk routeert
# hierheen en loopt door dezelfde stations als elk ander project. Dit bestand is daarmee meteen het
# levende voorbeeld van het contract — en het bewijs dat een consument ZONDER self-hosted runners
# gewoon werkt.
#
# Schema + validator: scripts/check-fleet-yml.py (strikt op onbekende sleutels — een typefout mag
# nooit stilzwijgend een default activeren die niemand koos).

version: 1

# Deze repo heeft geen self-hosted runners: alle lanes wijzen naar de fallback. Dat is een geldige
# configuratie, geen tekortkoming — de zwaarte van een lane zegt iets over de consument, niet over
# de fleet-logica die 'm aanroept.
lanes:
  agent: ubuntu-latest
  heavy: ubuntu-latest
  light: ubuntu-latest
  fallback: ubuntu-latest

gates:
  # Geen mens-poort op features: deze repo bevat alleen machinerie, geen product. Verandert dat,
  # dan gaat deze op `true` en wacht een feature-PR hier ook op approval.
  #
  # LET OP — deze sleutel BESCHRIJFT sinds 2026-08-23 alleen nog. Tot die datum las géén enkele
  # workflow 'm: het contract beloofde een poort die nergens werd afgedwongen, want het gedrag zat
  # hardgecodeerd in auto-merge.yml. De stand die de machinerie echt uitvoert staat hieronder in
  # `autonomy`. Beide sleutels bestaan naast elkaar zolang de consumenten migreren; `autonomy` is
  # de sturende.
  feature_approval: false
  # Geen productie-omgeving: de Vloot levert niets uit.
  release_environment: null

# DE AUTONOMIESTAND — beslist de machine zelf, of hoort er een mens aan te pas? (docs/architectuur.md §4b)
#
# `mode` is de repo-default, `stations` overschrijft 'm per beslispunt, en de repo-variabele
# `FLEET_AUTONOMY` overschrijft allebei zonder dat er iets gecommit hoeft te worden — een
# schakelaar die een merge nodig heeft is geen schakelaar. De resolver
# (scripts/autonomie-beslis.sh) legt de volgorde vast en is per poort getest.
#
# WAAROM DEZE REPO OP AUTONOOM STAAT. Er zit geen product in: de "gebruiker" van een fout is een
# workflow-run, niet een mens met een app. Een verkeerde merge valt binnen één run op (checks.yml
# draait elke testsuite) en gaat met één revert weg. De verhouding tussen "hoe snel merk je een
# fout" en "hoe duur is 'ie" is hier gunstiger dan in welke consument dan ook.
#
# WAT ER NIET MEE OMGAAT — de vloer staat in élke stand:
#   • de gevoelige-paden-guard forceert altijd een echte approval;
#   • `needs-human` / `no-automerge` stoppen altijd;
#   • `FLEET_HALT=1` zet deze repo in één commando terug naar mens-in-de-lus;
#   • breaking changes wachten op een mens, want `allow_breaking` staat hieronder op false.
autonomy:
  mode: autonomous
  # Bewust false, ook in autonome stand. Een `feat!:` of `fix!:` hier is per definitie een
  # wijziging die elke consument tegelijk raakt — precies het geval waarin "één revert lost het op"
  # niet meer waar is, omdat de pin bij elke consument apart terug moet.
  allow_breaking: false

budgets:
  default_model: claude-sonnet-5
  escalation_model: claude-opus-5
  # Turn-budget per station (docs/gitflow.md §13). Lager dan bij een productrepo: infrawerk raakt
  # weinig bestanden en veel van het werk is lezen en redeneren, niet grootschalig wijzigen.
  max_turns:
    triage: 20
    plan: 40
    build: 60
    review: 30

# Het gedeelde woordenboek. Labels reizen NIET mee bij een issue-transfer — alleen namen die in de
# doelrepo bestaan overleven. Daarom moet elke consument deze drie garanderen.
labels:
  task: fleet-task
  human: needs-human
  epic: epic

# Workflows waarvan uitval stil zou zijn (I25). Voor deFleet is dat de poort: valt die uit, dan
# verdwijnen ideeën in het niets zonder dat iets het meldt.
spine:
  - intake.yml
