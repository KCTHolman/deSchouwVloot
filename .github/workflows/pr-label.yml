name: "[shared] PR label"

# SPLITSING + PARAMETRISERING (M6-pilot, 2026-07-28). Eerste `[shared]`-station dat naar de fleet
# gaat, bewust de kleinste: het label-schema `type:`/`size:`/`breaking` is generiek — elk project
# gebruikt conventional commits en heeft een diff-omvang. Alleen de GEBIEDEN zijn consument-kennis:
# `lib/` is Flutter, `web/` is Next.js, en een ander project heeft weer wat anders.
#
# Die grens loopt nu via `.fleet.yml` van de aanroeper (sectie `areas:`). Heeft een consument geen
# contract of geen gebieden, dan krijgt 'ie gewoon geen `area:`-labels en blijven type/size/breaking
# werken. Dat wordt zichtbaar gemeld, nooit stil overgeslagen.
#
# Stempelt elke PR automatisch met drie STABIELE dimensies, zodat de wekelijkse
# PR-samenvatting (en jij, in één oogopslag) kunt slicen op wat een PR ís:
#
#   type: …   — afgeleid van de conventional-commit-titel (feat/fix/docs/…).
#   area: …   — afgeleid van de gewijzigde paden (app/web/docs/ci/dashboard).
#   size: …   — afgeleid van de diff-omvang (XS…XL) als grove reviewlast-indicator.
#   breaking  — als de titel `!` heeft of de body een `BREAKING CHANGE:`-voetnoot.
#
# BEWUST NIET gelabeld: draft/ready/approved en "wacht al > 2 dagen". Dat zijn
# VLUCHTIGE statussen die de GitHub-API rechtstreeks en actueel teruggeeft
# (isDraft, reviewDecision, updatedAt); een label daarvoor zou continu flapperen
# en verouderen. De routine-prompt berekent die live — zie docs.
#
# Rolverdeling: pr-check = mechanica, pr-review = oordeel, pr-label = classificatie.
# Idempotent: labels worden bij elke edit herberekend; verouderde type/area/size-
# labels worden verwijderd. Raakt NOOIT de niet-beheerde labels aan (auto-deps,
# claude-*, governance-*, enz.).

on:
  workflow_call: {}

permissions:
  contents: read
  pull-requests: write
  issues: read # het gekoppelde issue lezen om het `auto-error`-label te propageren (epic #360 fase 3)

concurrency:
  group: pr-label-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  # Fase 2 (epic #636): kies de runner voor deze job.
  pick:
    # Fase 2 van epic #1152: override opgesplitst per spoor. `RUNNER_OVERRIDE_LIGHT` pint
    # alléén het lichte spoor; de oude globale `RUNNER_OVERRIDE` blijft als fallback bestaan
    # (naast, niet i.p.v.). Pick draait alleen als beide leeg zijn — zelfde skip-truc als
    # #1063, nu per lane. De concurrency-group hierboven is per-PR (raakt de override niet),
    # dus de #1050-uitzondering speelt hier niet.
    if: vars.RUNNER_OVERRIDE_LIGHT == '' && vars.RUNNER_OVERRIDE == ''
    uses: KCTHolman/fleet/.github/workflows/pick-runner.yml@main
    secrets: inherit # geeft RUNNER_CHECK_TOKEN door (leeg = veilige fallback op ubuntu-latest)
    # issue #789 (constitution-amendement 2026-07-11): self-hosted-eerst voor de hele
    # gitflow-/agent-fleet — ook schedule-/issues-/PR-/workflow_run-context probeert
    # de self-hosted lane; de ubuntu-latest-fallback blijft intact via pick-runner.yml.
    with:
      # Fase 1 van epic #1152: geef expliciet het lane-label mee (runner_label is sinds de
      # lane-migratie verplicht). pr-label is licht secondenwerk → het lichte spoor (biohack-light).
      # De ubuntu-latest-fallback blijft via pick-runner.yml gelden zolang de biohack-light-
      # registratie nog niet online is.
      runner_label: biohack-light
      trusted_context_only: false

  label:
    needs: pick
    # Guard per lane (fase 2, #1152): spoor-specifieke óf globale override, óf pick geslaagd.
    if: always() && (vars.RUNNER_OVERRIDE_LIGHT != '' || vars.RUNNER_OVERRIDE != '' || needs.pick.result == 'success')
    runs-on: ${{ vars.RUNNER_OVERRIDE_LIGHT || vars.RUNNER_OVERRIDE || needs.pick.outputs.runner }}
    timeout-minutes: 5
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      REPO: ${{ github.repository }}
      PR: ${{ github.event.pull_request.number }}
      # Titel via env (niet interpoleren in de shell) — voorkomt script-injectie.
      TITLE: ${{ github.event.pull_request.title }}
    steps:
      # --- CONTRACT VAN DE AANROEPER INLEZEN (M6-pilot) -------------------------------------
      # De gebieden komen uit `.fleet.yml` van de consument. Daarvoor is zowel diens checkout
      # nodig (het contract zelf) als die van deze repo (het leesscript).
      - name: Aanroeper uitchecken
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: App-token munten (leestoegang tot de fleet-repo)
        id: app
        uses: actions/create-github-app-token@fee1f7d63c2ff003460e3d139729b119787bc349 # v2
        with:
          app-id: ${{ secrets.APP_ID || secrets.WORKFLOW_APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY || secrets.WORKFLOW_APP_PRIVATE_KEY }}
          owner: KCTHolman
          repositories: fleet

      - name: Fleet-scripts ophalen
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: KCTHolman/fleet
          ref: main
          path: .fleet-lib
          token: ${{ steps.app.outputs.token }}
          persist-credentials: false

      - name: Gebieden uit .fleet.yml lezen
        # Geen contract of geen `areas:` levert een LEEG bestand op — dan krijgt deze consument
        # simpelweg geen `area:`-labels, terwijl type/size/breaking gewoon blijven werken. Dat
        # wordt hier hardop gemeld: stil overslaan is precies hoe een station maandenlang op een
        # halve configuratie kan draaien zonder dat iemand het merkt.
        run: |
          set -euo pipefail
          # Geen `pip install`: het leesscript heeft bewust geen afhankelijkheden. De eerste
          # versie installeerde PyYAML en viel om op de self-hosted light-lane, waar de
          # systeem-Python extern beheerd is (PEP 668).
          python3 .fleet-lib/scripts/fleet-yml-areas.py .fleet.yml > /tmp/fleet-areas.tsv
          n=$(wc -l < /tmp/fleet-areas.tsv | tr -d ' ')
          if [ "$n" -eq 0 ]; then
            echo "::warning::geen \`areas:\` in .fleet.yml — deze PR krijgt geen area:-labels"
          else
            echo "$n gebied(en) uit het contract:"
            cut -f1 /tmp/fleet-areas.tsv | sed 's/^/  - /'
          fi


      - name: Beheerde labels idempotent aanmaken
        run: |
          set -uo pipefail
          mklabel() { gh label create "$1" --repo "$REPO" --color "$2" --description "$3" 2>/dev/null || true; }

          # type: — één per PR, uit de conventional-commit-prefix.
          mklabel "type: feature"  "0E8A16" "feat — nieuwe functionaliteit"
          mklabel "type: fix"      "D73A4A" "fix — bugfix"
          mklabel "type: docs"     "0075CA" "docs — alleen documentatie"
          mklabel "type: refactor" "FBCA04" "refactor — geen gedragswijziging"
          mklabel "type: chore"    "CFD3D7" "chore/build/ci — onderhoud"
          mklabel "type: test"     "BFD4F2" "test — alleen tests"
          mklabel "type: perf"     "5319E7" "perf — prestatieverbetering"
          mklabel "breaking"       "B60205" "feat!/BREAKING CHANGE — major bump"

          # area: — kan meerdere tegelijk. GEPARAMETRISEERD (M6-pilot): de gebieden komen
          # uit `.fleet.yml` van de AANROEPER, want `lib/` is Flutter en `web/` is Next.js —
          # dat is consument-kennis. Het label-schema eromheen (type/size/breaking) is wel
          # generiek en blijft hier staan.
          while IFS=$'\t' read -r lbl _paths clr desc; do
            [ -n "$lbl" ] && mklabel "$lbl" "$clr" "$desc"
          done < /tmp/fleet-areas.tsv

          # size: — één per PR, uit additions+deletions.
          mklabel "size: XS" "EEEEEE" "< 10 regels"
          mklabel "size: S"  "EEEEEE" "< 50 regels"
          mklabel "size: M"  "EEEEEE" "< 200 regels"
          mklabel "size: L"  "EEEEEE" "< 500 regels"
          mklabel "size: XL" "EEEEEE" ">= 500 regels"

      - name: Labels berekenen en toepassen
        run: |
          set -uo pipefail

          BODY="$(jq -r '.pull_request.body // ""' "$GITHUB_EVENT_PATH" | tr -d '\r')"

          # --- type: -------------------------------------------------------------------
          prefix="$(printf '%s' "$TITLE" | sed -nE 's/^([a-zA-Z]+)(\([^)]*\))?!?:.*/\1/p' | tr '[:upper:]' '[:lower:]')"
          type=""
          case "$prefix" in
            feat)            type="type: feature"  ;;
            fix)             type="type: fix"      ;;
            docs)            type="type: docs"     ;;
            refactor)        type="type: refactor" ;;
            chore|build|ci)  type="type: chore"    ;;
            test)            type="type: test"     ;;
            perf)            type="type: perf"     ;;
          esac

          # --- breaking: `!` vóór de dubbele punt, of BREAKING CHANGE-voetnoot ---------
          breaking=""
          if printf '%s' "$TITLE" | grep -qE '^[a-zA-Z]+(\([^)]*\))?!:'; then breaking="breaking"; fi
          if printf '%s\n' "$BODY" | grep -qE '^BREAKING CHANGE:'; then breaking="breaking"; fi

          # --- area: uit de gewijzigde paden -------------------------------------------
          files="$(gh pr view "$PR" --repo "$REPO" --json files --jq '.files[].path')"
          areas=()
          # Elk gebied uit het contract van de aanroeper. De regex is daar al gevalideerd
          # (check-fleet-yml.py toetst 'm op compileerbaarheid), dus een kapot patroon
          # haalt deze plek niet — het zou hier stil geen enkel gebied meer toekennen.
          while IFS=$'\t' read -r lbl paths _clr _desc; do
            [ -n "$lbl" ] || continue
            printf '%s\n' "$files" | grep -qE "$paths" && areas+=("$lbl")
          done < /tmp/fleet-areas.tsv

          # --- size: uit additions+deletions -------------------------------------------
          read -r adds dels < <(gh pr view "$PR" --repo "$REPO" --json additions,deletions \
                                  --jq '"\(.additions) \(.deletions)"')
          total=$(( ${adds:-0} + ${dels:-0} ))
          if   [ "$total" -lt 10 ];  then size="size: XS"
          elif [ "$total" -lt 50 ];  then size="size: S"
          elif [ "$total" -lt 200 ]; then size="size: M"
          elif [ "$total" -lt 500 ]; then size="size: L"
          else                            size="size: XL"
          fi

          # --- gewenste beheerde labels verzamelen -------------------------------------
          want=()
          [ -n "$type" ]     && want+=("$type")
          [ -n "$breaking" ] && want+=("$breaking")
          for a in "${areas[@]:-}"; do [ -n "$a" ] && want+=("$a"); done
          want+=("$size")

          # --- toepassen via de REST-API -----------------------------------------------
          # We gebruiken bewust `gh api` i.p.v. `gh pr edit --add-label`: die laatste
          # loopt via een GraphQL-pad dat de `read:org`-scope eist, wat op sommige tokens
          # faalt. De issues/labels-REST-endpoints hebben genoeg aan `repo`.

          is_managed() {
            case "$1" in
              "type: "*|"area: "*|"size: "*|"breaking") return 0 ;;
              *) return 1 ;;
            esac
          }
          in_want() { local x; for x in "${want[@]}"; do [ "$x" = "$1" ] && return 0; done; return 1; }

          # Verouderde beheerde labels weghalen (bv. titel ging van feat → fix).
          mapfile -t current < <(gh pr view "$PR" --repo "$REPO" --json labels --jq '.labels[].name')
          for l in "${current[@]:-}"; do
            if is_managed "$l" && ! in_want "$l"; then
              echo "− $l"
              enc="${l// /%20}"                       # spaties URL-encoderen
              gh api -X DELETE "repos/$REPO/issues/$PR/labels/$enc" >/dev/null 2>&1 || true
            fi
          done

          # Gewenste labels toevoegen (POST is additief én idempotent).
          args=()
          for w in "${want[@]}"; do echo "+ $w"; args+=(-f "labels[]=$w"); done
          gh api -X POST "repos/$REPO/issues/$PR/labels" "${args[@]}" >/dev/null || true

          echo "Klaar: type='${type:-—}' breaking='${breaking:-—}' areas='${areas[*]:-—}' size='$size' (Δ$total)"

      - name: auto-error-label propageren vanaf het gekoppelde issue
        # Anker het `auto-error`-label in de pijplijn (epic #360 fase 3). Een fout die de app
        # auto-rapporteert wordt een `auto-error`-issue; de daaruit gebouwde PR moet dat label óók
        # dragen, want auto-merge.yml leidt de autonome merge+release-escalatie (mits de
        # gevoelige-paden-guard schoon is) af uit de PR-LABELS. We lezen het gekoppelde issue uit een
        # `Fixes/Closes #N` in de PR-body en kopiëren `auto-error` naar de PR. Puur additief:
        # pr-label verwijdert alleen z'n eigen beheerde type/area/size/breaking-labels, nooit dit.
        run: |
          set -uo pipefail
          BODY="$(jq -r '.pull_request.body // ""' "$GITHUB_EVENT_PATH" | tr -d '\r')"
          issue="$(printf '%s' "$BODY" \
            | grep -oiE '(close[sd]?|fix(e[sd])?|resolve[sd]?)[[:space:]]+#[0-9]+' \
            | grep -oE '[0-9]+' | tail -1 || true)"
          if [ -z "${issue:-}" ]; then
            echo "Geen gekoppeld issue in de PR-body — niets te propageren."; exit 0
          fi
          if gh issue view "$issue" --repo "$REPO" --json labels --jq '.labels[].name' 2>/dev/null \
               | grep -qx 'auto-error'; then
            echo "Issue #$issue heeft label auto-error → op PR #$PR zetten."
            gh label create 'auto-error' --repo "$REPO" --color 'D93F0B' \
              --description 'Door de app auto-gerapporteerde fout (epic #360)' 2>/dev/null || true
            gh api -X POST "repos/$REPO/issues/$PR/labels" -f 'labels[]=auto-error' >/dev/null 2>&1 \
              || echo "::warning::Kon auto-error-label niet op PR #$PR zetten."
          else
            echo "Issue #$issue heeft geen auto-error-label — niets te doen."
          fi
