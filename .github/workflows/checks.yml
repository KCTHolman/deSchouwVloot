name: "[fleet] Checks"

# De CI van de fleet-repo zelf: draait alle shell-testsuites en de contractvalidator.
#
# WAAROM DIT BESTAAT. Tot 2026-07-28 had deze repo 41 tests die NIETS automatisch draaide. Wie
# `routing.yml` aanpaste of aan de doctor sleutelde, kreeg pas bij de eerstvolgende echte run te
# horen dat er iets stuk was — en de poort is het station dat élk idee raakt. Een testsuite die
# alleen lokaal draait is een testsuite die de dag na het schrijven al kan roesten.
#
# WAAROM ALS `workflow_call` EN NIET DIRECT. Invariant I1: fleet-logica draagt geen eigen trigger.
# De triggers staan in `checks-caller.yml` — dezelfde splitsing die elke consument krijgt, hier op
# onszelf toegepast. Dat is meteen de goedkoopste test van dat patroon.
#
# Draait op `ubuntu-latest`: deze repo heeft geen eigen runners, en de suites hebben niets nodig
# behalve bash, awk, sed en python met PyYAML.

on:
  workflow_call:
    inputs:
      runner:
        type: string
        required: false
        default: ubuntu-latest

permissions:
  contents: read

jobs:
  tests:
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v6
        with:
          python-version: "3.x"

      - name: PyYAML installeren
        run: python -m pip install --quiet pyyaml

      - name: Testsuites draaien
        # Expliciet GEEN `-e` (GitHub's bash-default): ALLE suites moeten draaien, ook als de
        # eerste faalt. Anders zie je per push maar één probleem tegelijk — dezelfde les als
        # bij de doctor (gitflow §10 punt 10).
        shell: bash --noprofile --norc {0}
        run: |
          rc=0
          out() { tee -a "$GITHUB_STEP_SUMMARY"; }
          printf '# Fleet-checks\n\n' | out

          for suite in scripts/*.test.sh; do
            [ -f "$suite" ] || continue
            printf '\n## %s\n\n```\n' "$(basename "$suite")" | out
            bash "$suite" 2>&1 | out
            [ "${PIPESTATUS[0]}" -ne 0 ] && rc=1
            printf '```\n' | out
          done

          # GOLDEN-RUN apart van de suites: die toetsen of de LOGICA klopt, deze of de
          # CONFIGURATIE nog de bedoelde uitkomst geeft voor echt werk. Een te breed trefwoord in
          # routing.yml houdt de suites groen en laat toch de helft van de issues stuiteren.
          printf '\n## golden-run (bevroren gevallen)\n\n```\n' | out
          bash scripts/golden-run.sh 2>&1 | out
          [ "${PIPESTATUS[0]}" -ne 0 ] && rc=1
          printf '```\n' | out

          printf '\n## fleet-doctor op zichzelf\n\n```\n' | out
          for m in consistentie contract; do
            bash scripts/fleet-doctor.sh --module "$m" --root . 2>&1 | out
            [ "${PIPESTATUS[0]}" -ne 0 ] && rc=1
          done
          printf '```\n\n' | out

          if [ "$rc" -ne 0 ]; then
            printf '❌ **Er zijn falende checks.**\n' | out
          else
            printf '✅ **Alles groen.**\n' | out
          fi
          exit "$rc"

      - name: Statische analyse (shellcheck + actionlint)
        # WAAROM DIT ER PAS NU IS. Tot 2026-08-23 ging ±1.970 regels bash — waarvan het grootste
        # deel INLINE in workflows — door geen enkele parser. Een verkeerd geplaatste `fi` of een
        # niet-gequote expansie bereikte `main` zonder dat iets rood werd. De testsuites toetsen
        # alleen de scripts die er een hebben; dit toetst alles wat bash IS.
        #
        # WARNING EN HOGER, NIET STYLE/INFO. Op `info` geeft shellcheck 54 bevindingen die vrijwel
        # allemaal SC2015 (`a && b || c`) en SC2016 (`$` in enkele quotes) zijn — beide bewuste
        # idiomen in deze repo. Een poort die je leert wegkijken is geen poort.
        #
        # DEGRADEREN MAG, STIL VERDWIJNEN NIET. Lukt het installeren niet (netwerk), dan wordt dat
        # een zichtbare ⚠️ in de samenvatting — nooit een stilzwijgend groen vinkje. Zelfde
        # redenering als de `runners`-module van de doctor.
        if: always()
        shell: bash --noprofile --norc {0}
        run: |
          rc=0
          out() { tee -a "$GITHUB_STEP_SUMMARY"; }
          printf '\n## Statische analyse\n\n' | out

          if command -v shellcheck >/dev/null 2>&1; then
            printf '### shellcheck (severity: warning)\n\n```\n' | out
            shellcheck --severity=warning --shell=bash scripts/*.sh 2>&1 | out
            [ "${PIPESTATUS[0]}" -ne 0 ] && rc=1
            printf '```\n\n' | out
          else
            printf '⚠️  shellcheck ontbreekt op deze runner — scripts ONGETOETST op syntaxis.\n\n' | out
            echo "::warning::shellcheck ontbreekt — statische analyse van scripts/ overgeslagen."
          fi

          # actionlint is niet voorgeïnstalleerd; de officiële downloader zet 'm in de werkmap.
          if [ ! -x ./actionlint ]; then
            curl -fsSL https://raw.githubusercontent.com/rhysd/actionlint/main/scripts/download-actionlint.bash \
              | bash >/dev/null 2>&1 || true
          fi

          if [ -x ./actionlint ]; then
            # Wrapper zodat actionlints ingebouwde shellcheck óók op `warning` staat: zonder dit
            # lekt elke style/info-melding uit de INLINE workflow-bash de poort in.
            printf '#!/usr/bin/env bash\nexec shellcheck --severity=warning "$@"\n' > ./sc-warn
            chmod +x ./sc-warn

            printf '### actionlint (warning en hoger)\n\n```\n' | out
            # `job_workflow_sha` IS een echte GitHub-context-property (gedocumenteerd voor reusable
            # workflows); actionlints type-schema loopt daarop achter. Bewust genegeerd — niet
            # omdat de melding lastig is, maar omdat 'ie aantoonbaar onjuist is.
            ./actionlint -shellcheck ./sc-warn \
              -ignore 'property "job_workflow_sha" is not defined' \
              .github/workflows/*.yml 2>&1 | out
            [ "${PIPESTATUS[0]}" -ne 0 ] && rc=1
            printf '```\n\n' | out
            rm -f ./actionlint ./sc-warn
          else
            printf '⚠️  actionlint niet op te halen — workflows ONGETOETST.\n\n' | out
            echo "::warning::actionlint niet beschikbaar — statische analyse van workflows overgeslagen."
          fi

          exit "$rc"
